<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập | PC Parts Shop</title><meta name="description" content="Cửa hàng linh kiện PC: CPU, RAM, card đồ họa và nguồn máy tính."><link rel="stylesheet" href="/css/styles.css"><script type="module" src="/js/account.js"></script></head>
<body data-page="login" data-role="public">
<a class="skip-link" href="#main" data-testid="nav-skip-link">Đến nội dung chính</a>
<header id="site-header"></header>
<div id="loading" class="loading" data-testid="loading-indicator" role="status" hidden>Đang tải dữ liệu…</div>
<div id="toast" class="toast" data-testid="toast-message" data-type="success" role="status" hidden><span id="toast-text"></span><button type="button" data-testid="toast-close-button" aria-label="Đóng thông báo">Đóng</button></div>
<div class="app-layout"><aside id="admin-nav" hidden></aside><main id="main" tabindex="-1"><div id="page-error" class="message error" data-testid="login-page-error-message" role="alert" hidden></div><div id="content"></div></main></div>
<footer class="site-footer"><span>PC Parts Shop</span><span>Linh kiện cho cấu hình của bạn.</span></footer>
<dialog id="confirm-dialog" data-testid="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">Xác nhận thao tác</h2><p id="confirm-text" data-testid="confirm-dialog-message"></p><div class="actions"><button type="button" class="secondary" data-testid="confirm-dialog-no-button">Giữ nguyên</button><button type="button" data-testid="confirm-dialog-yes-button">Xác nhận</button></div></dialog>
<noscript>Vui lòng bật JavaScript để sử dụng cửa hàng.</noscript>
</body></html>
